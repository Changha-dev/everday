spring:
  config:
    activate:
      on-profile: dev # 'dev' 프로필일 때 이 설정이 활성화됩니다.
  datasource:
    # docker-compose.yml의 환경변수에서 값을 가져옵니다.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update # 실제 DB에서는 validate 또는 none을 권장하지만, 개발 단계에서는 update를 사용합니다.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

